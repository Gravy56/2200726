<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Whiskey Musikk Vault</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen font-sans flex flex-col selection:bg-purple-500 selection:text-white">

  <!-- Minimalist Header -->
  <header class="border-b border-zinc-800/80 bg-zinc-950/80 backdrop-blur sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
      
      <!-- Brand Title -->
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-purple-600/20 border border-purple-500/30 flex items-center justify-center text-purple-400 text-xl font-bold">
          🎧
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-tight text-white">Whiskey Musikk Vault</h1>
          <p class="text-xs text-zinc-400">Community Discord Music Recommendations</p>
        </div>
      </div>
      
      <!-- Search & Filters -->
      <div class="flex flex-wrap items-center gap-2.5 w-full sm:w-auto">
        <div class="inline-flex rounded-lg bg-zinc-900 p-1 border border-zinc-800">
          <button id="btnAll" onclick="filterCategory('all')" class="px-3 py-1.5 rounded-md text-xs font-semibold bg-purple-600 text-white transition">All</button>
          <button id="btnSongs" onclick="filterCategory('song')" class="px-3 py-1.5 rounded-md text-xs font-semibold text-zinc-400 hover:text-white transition">Songs</button>
          <button id="btnAlbums" onclick="filterCategory('album')" class="px-3 py-1.5 rounded-md text-xs font-semibold text-zinc-400 hover:text-white transition">Albums</button>
        </div>

        <input 
          type="text" 
          id="searchInput" 
          oninput="handleSearch()"
          placeholder="Search track or user..." 
          class="w-full sm:w-60 px-3.5 py-2 bg-zinc-900 border border-zinc-800 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 text-xs text-zinc-200 placeholder-zinc-500"
        />
      </div>

    </div>
  </header>

  <!-- Main Content Grid -->
  <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full">
    <div id="musicGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      <div class="col-span-full text-center py-24 text-zinc-500 animate-pulse">Loading music database...</div>
    </div>
  </main>

  <!-- Audio / Preview Modal Drawer -->
  <div id="playerModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-zinc-900 border border-zinc-800 rounded-2xl max-w-md w-full p-6 relative shadow-2xl">
      <button onclick="closePlayer()" class="absolute top-4 right-4 text-zinc-400 hover:text-white text-lg font-bold">✕</button>
      
      <div class="flex items-center gap-4 mb-5">
        <img id="modalArt" src="" class="w-20 h-20 rounded-xl object-cover border border-zinc-800" />
        <div>
          <span id="modalType" class="text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 rounded-full bg-purple-900/60 text-purple-300 border border-purple-700/50">Song</span>
          <h2 id="modalTitle" class="text-base font-bold text-white mt-1 line-clamp-1">Track Title</h2>
          <p id="modalUser" class="text-xs text-zinc-400 mt-0.5">Shared by @username</p>
        </div>
      </div>

      <!-- Audio Preview Element -->
      <div id="audioContainer" class="mb-5 hidden">
        <audio id="audioPlayer" controls class="w-full h-10 accent-purple-500"></audio>
      </div>
      <div id="noAudioMsg" class="text-xs text-zinc-500 bg-zinc-950 p-3 rounded-xl border border-zinc-800/60 mb-5 text-center">
        Direct audio preview not available for this link. Use Apple Music below to listen.
      </div>

      <div class="flex gap-3">
        <a id="modalExternalLink" href="#" target="_blank" class="flex-1 py-2.5 bg-purple-600 hover:bg-purple-500 text-white text-xs font-semibold rounded-xl text-center transition">
          Open in Apple Music ↗
        </a>
        <button onclick="closePlayer()" class="px-4 py-2.5 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 text-xs font-semibold rounded-xl transition">
          Close
        </button>
      </div>
    </div>
  </div>

  <footer class="border-t border-zinc-900 py-6 text-center text-xs text-zinc-600">
    Whiskey Musikk Vault &bull; Powered by GitHub Pages & Google Sheets
  </footer>

  <script>
    const SONGS_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTFK6-UVGGAW6bbnfckUwCAjgY2TPq770ydA62KahEozyLLgl_DcBeTQB6UyMOFblf0cm77BnbCcCQH/pub?output=csv";
    const ALBUMS_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTFK6-UVGGAW6bbnfckUwCAjgY2TPq770ydA62KahEozyLLgl_DcBeTQB6UyMOFblf0cm77BnbCcCQH/pub?gid=1206056264&single=true&output=csv";

    let allRecommendations = [];
    let currentCategory = 'all';

    function fetchCSV(url) {
      return new Promise((resolve, reject) => {
        Papa.parse(url, {
          download: true,
          header: true,
          skipEmptyLines: true,
          complete: (results) => resolve(results.data),
          error: (err) => reject(err)
        });
      });
    }

    function getValue(row, ...keys) {
      for (let k of keys) {
        if (row[k] !== undefined && row[k] !== '') return row[k];
      }
      return '';
    }

    function generateGradientArt(text) {
      let hash = 0;
      for (let i = 0; i < text.length; i++) {
        hash = text.charCodeAt(i) + ((hash << 5) - hash);
      }
      const c1 = `hsl(${Math.abs(hash) % 360}, 70%, 25%)`;
      const c2 = `hsl(${(Math.abs(hash) + 60) % 360}, 60%, 15%)`;
      return `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="${c1}"/><stop offset="100%" stop-color="${c2}"/></linearGradient></defs><rect width="400" height="400" fill="url(%23g)"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-family="sans-serif" font-weight="bold" font-size="24">${encodeURIComponent(text.substring(0, 24))}</text></svg>`;
    }

    async function initVault() {
      try {
        const [songsData, albumsData] = await Promise.all([
          fetchCSV(SONGS_CSV_URL).catch(() => []),
          fetchCSV(ALBUMS_CSV_URL).catch(() => [])
        ]);

        const songs = songsData.map(item => ({
          type: 'song',
          user: getValue(item, 'Username', 'Author', 'User') || 'Anonymous',
          title: getValue(item, 'Song Title', 'Title', 'Song', 'Album') || 'Untitled Track',
          link: getValue(item, 'Link', 'URL', 'Apple Music Link'),
          artwork: getValue(item, 'Artwork', 'Cover', 'Image'),
          date: getValue(item, 'Date', 'Timestamp')
        }));

        const albums = albumsData.map(item => ({
          type: 'album',
          user: getValue(item, 'Username', 'Author', 'User') || 'Anonymous',
          title: getValue(item, 'Album', 'Album Title', 'Title') || 'Untitled Album',
          link: getValue(item, 'Link', 'URL', 'Apple Music Link'),
          artwork: getValue(item, 'Artwork', 'Cover', 'Image'),
          date: getValue(item, 'Date', 'Timestamp')
        }));

        allRecommendations = [...songs, ...albums].sort((a, b) => new Date(b.date) - new Date(a.date));
        renderGrid(allRecommendations);
      } catch (err) {
        console.error("CSV Fetch Error:", err);
        document.getElementById('musicGrid').innerHTML = `
          <div class="col-span-full text-center py-16 text-red-400 text-xs">
            Failed to load sheet data. Ensure the document is published to the web as CSV.
          </div>`;
      }
    }

    function renderGrid(items) {
      const grid = document.getElementById('musicGrid');
      if (items.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center py-16 text-zinc-500 text-xs">No matching recommendations found.</div>`;
        return;
      }

      grid.innerHTML = items.map((item, index) => {
        const hasArt = item.artwork && String(item.artwork).startsWith('http');
        const imageSrc = hasArt ? item.artwork : generateGradientArt(item.title);
        const badgeColor = item.type === 'song' ? 'bg-purple-900/60 text-purple-300 border-purple-700/50' : 'bg-indigo-900/60 text-indigo-300 border-indigo-700/50';

        const safeTitle = item.title.replace(/'/g, "\\'");
        const safeUser = item.user.replace(/'/g, "\\'");
        const safeArt = imageSrc.replace(/'/g, "\\'");
        const safeLink = item.link || '';

        return `
          <div class="bg-zinc-950 border border-zinc-800/80 rounded-xl overflow-hidden hover:border-zinc-700 transition flex flex-col group">
            <div class="relative aspect-square overflow-hidden bg-zinc-900 cursor-pointer" onclick="openPlayer('${safeTitle}', '${safeUser}', '${safeArt}', '${safeLink}', '${item.type}')">
              <img src="${imageSrc}" alt="${item.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" />
              <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition flex items-center justify-center">
                <span class="px-3 py-1.5 bg-purple-600 text-white rounded-full text-xs font-semibold shadow-lg">▶ Play / View</span>
              </div>
              <span class="absolute top-2.5 right-2.5 px-2 py-0.5 rounded-full text-[9px] font-bold uppercase tracking-wider border backdrop-blur ${badgeColor}">
                ${item.type}
              </span>
            </div>
            
            <div class="p-3.5 flex flex-col flex-grow justify-between">
              <div>
                <h3 class="font-semibold text-white text-sm line-clamp-1 leading-snug" title="${item.title}">${item.title}</h3>
                <p class="text-xs text-zinc-400 mt-1">Shared by <span class="text-purple-400 font-medium">@${item.user}</span></p>
              </div>

              <div class="mt-3 pt-2.5 border-t border-zinc-900 flex items-center justify-between text-[11px] text-zinc-500">
                <span>${item.date ? String(item.date).split(' ')[0] : ''}</span>
                ${item.link ? `
                  <a href="${item.link}" target="_blank" rel="noopener noreferrer" class="text-purple-400 hover:text-purple-300 font-medium">
                    Apple Music ↗
                  </a>
                ` : ''}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function openPlayer(title, user, art, link, type) {
      document.getElementById('modalTitle').innerText = title;
      document.getElementById('modalUser').innerText = `Shared by @${user}`;
      document.getElementById('modalArt').src = art;
      document.getElementById('modalType').innerText = type;
      document.getElementById('modalExternalLink').href = link || '#';

      const audioPlayer = document.getElementById('audioPlayer');
      const audioContainer = document.getElementById('audioContainer');
      const noAudioMsg = document.getElementById('noAudioMsg');

      // Check if link is a direct streamable file or preview
      if (link && (link.endsWith('.mp3') || link.endsWith('.m4a') || link.includes('preview'))) {
        audioPlayer.src = link;
        audioContainer.classList.remove('hidden');
        noAudioMsg.classList.add('hidden');
      } else {
        audioPlayer.pause();
        audioPlayer.src = '';
        audioContainer.classList.add('hidden');
        noAudioMsg.classList.remove('hidden');
      }

      document.getElementById('playerModal').classList.remove('hidden');
    }

    function closePlayer() {
      const audioPlayer = document.getElementById('audioPlayer');
      audioPlayer.pause();
      audioPlayer.src = '';
      document.getElementById('playerModal').classList.add('hidden');
    }

    function filterCategory(cat) {
      currentCategory = cat;
      ['all', 'song', 'album'].forEach(c => {
        const btn = document.getElementById(`btn${c.charAt(0).toUpperCase() + c.slice(1)}s` || 'btnAll');
        if (btn) {
          btn.className = (c === cat || (cat === 'all' && c === 'all'))
            ? "px-3 py-1.5 rounded-md text-xs font-semibold bg-purple-600 text-white transition"
            : "px-3 py-1.5 rounded-md text-xs font-semibold text-zinc-400 hover:text-white transition";
        }
      });
      handleSearch();
    }

    function handleSearch() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = allRecommendations.filter(item => {
        const matchesCategory = currentCategory === 'all' || item.type === currentCategory;
        const matchesQuery = String(item.title).toLowerCase().includes(query) || String(item.user).toLowerCase().includes(query);
        return matchesCategory && matchesQuery;
      });
      renderGrid(filtered);
    }

    initVault();
  </script>
</body>
</html>
