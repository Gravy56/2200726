<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Whiskey Musikk Recommendations</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen font-sans flex flex-col">

  <!-- Navigation Bar -->
  <header class="border-b border-zinc-800 bg-zinc-900/80 backdrop-blur sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
      <div class="flex items-center gap-3">
        <span class="text-3xl">🎧</span>
        <h1 class="text-2xl font-bold tracking-tight text-white">Community Music Vault</h1>
      </div>
      
      <!-- Controls: Filter & Search -->
      <div class="flex flex-col sm:flex-row gap-3 w-full md:w-auto">
        <div class="inline-flex rounded-lg bg-zinc-800 p-1 border border-zinc-700/50">
          <button id="btnAll" onclick="filterCategory('all')" class="px-3 py-1.5 rounded-md text-xs font-semibold bg-purple-600 text-white transition">All</button>
          <button id="btnSongs" onclick="filterCategory('song')" class="px-3 py-1.5 rounded-md text-xs font-semibold text-zinc-400 hover:text-white transition">🎵 Songs</button>
          <button id="btnAlbums" onclick="filterCategory('album')" class="px-3 py-1.5 rounded-md text-xs font-semibold text-zinc-400 hover:text-white transition">💿 Albums</button>
        </div>

        <input 
          type="text" 
          id="searchInput" 
          oninput="handleSearch()"
          placeholder="Search track, artist, or user..." 
          class="w-full md:w-72 px-4 py-2 bg-zinc-900 border border-zinc-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 text-sm text-zinc-200 placeholder-zinc-500"
        />
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full">
    <!-- Grid Layout -->
    <div id="musicGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      <div class="col-span-full text-center py-20 text-zinc-500 animate-pulse">Loading live music recommendations...</div>
    </div>
  </main>

  <script>
    const SHEET_ID = "1x2eOd0Jc_uoWJj2jCVTwJ2sbgQFfBNXOj5A8VbvU93M";
    let allRecommendations = [];
    let currentCategory = 'all';

    async function fetchMusicData() {
      try {
        const [songsRes, albumsRes] = await Promise.all([
          fetch(`https://opensheet.elk.sh/${SHEET_ID}/Songs`),
          fetch(`https://opensheet.elk.sh/${SHEET_ID}/Albums`)
        ]);

        const songs = await songsRes.json();
        const albums = await albumsRes.json();

        const formattedSongs = songs.map(item => ({
          type: 'song',
          title: item['Song Title'] || item.Title || item.content || 'Untitled Song',
          user: item.Username || item.Author || 'Anonymous',
          link: item.Link || '',
          artwork: item.Artwork || item.Cover || '',
          date: item.Date || ''
        }));

        const formattedAlbums = albums.map(item => ({
          type: 'album',
          title: item.Album || item['Album Title'] || item.content || 'Untitled Album',
          user: item.Username || item.Author || 'Anonymous',
          link: item.Link || '',
          artwork: item.Artwork || item.Cover || '',
          date: item.Date || ''
        }));

        // Combine and sort newest first by date string
        allRecommendations = [...formattedSongs, ...formattedAlbums].sort((a, b) => {
          return new Date(b.date) - new Date(a.date);
        });

        renderGrid(allRecommendations);
      } catch (error) {
        console.error("Error loading data:", error);
        document.getElementById('musicGrid').innerHTML = `
          <div class="col-span-full text-center py-12 text-red-400">
            Failed to load sheet data. Ensure the Google Sheet is shared with "Anyone with the link".
          </div>`;
      }
    }

    function renderGrid(items) {
      const grid = document.getElementById('musicGrid');
      
      if (items.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center py-12 text-zinc-500">No matching recommendations found.</div>`;
        return;
      }

      grid.innerHTML = items.map(item => {
        const defaultArt = 'https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=600&auto=format&fit=crop&q=60';
        const imageSrc = item.artwork && item.artwork.startsWith('http') ? item.artwork : defaultArt;
        const badgeColor = item.type === 'song' ? 'bg-purple-900/60 text-purple-300 border-purple-700/50' : 'bg-indigo-900/60 text-indigo-300 border-indigo-700/50';

        return `
          <div class="bg-zinc-900/60 border border-zinc-800/80 rounded-xl overflow-hidden hover:border-zinc-700 transition flex flex-col group">
            <div class="relative aspect-square overflow-hidden bg-zinc-950">
              <img src="${imageSrc}" alt="${item.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" />
              <span class="absolute top-3 right-3 px-2 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-wider border backdrop-blur ${badgeColor}">
                ${item.type}
              </span>
            </div>
            
            <div class="p-4 flex flex-col flex-grow justify-between">
              <div>
                <h3 class="font-semibold text-white text-base line-clamp-2 leading-snug" title="${item.title}">${item.title}</h3>
                <p class="text-xs text-zinc-400 mt-2">Shared by <span class="text-purple-400 font-medium">@${item.user}</span></p>
              </div>

              <div class="mt-4 pt-3 border-t border-zinc-800/60 flex items-center justify-between text-xs text-zinc-500">
                <span>${item.date ? item.date.split(' ')[0] : ''}</span>
                ${item.link ? `
                  <a href="${item.link}" target="_blank" rel="noopener noreferrer" class="px-3 py-1 bg-purple-600 hover:bg-purple-500 text-white font-semibold rounded-md transition text-xs flex items-center gap-1">
                    Listen ↗
                  </a>
                ` : ''}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function filterCategory(cat) {
      currentCategory = cat;
      
      // Update UI active tab styles
      ['all', 'song', 'album'].forEach(c => {
        const btn = document.getElementById(`btn${c.charAt(0).toUpperCase() + c.slice(1)}s` || 'btnAll');
        if (c === cat || (cat === 'all' && c === 'all')) {
          btn.className = "px-3 py-1.5 rounded-md text-xs font-semibold bg-purple-600 text-white transition";
        } else {
          btn.className = "px-3 py-1.5 rounded-md text-xs font-semibold text-zinc-400 hover:text-white transition";
        }
      });

      handleSearch();
    }

    function handleSearch() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      
      const filtered = allRecommendations.filter(item => {
        const matchesCategory = currentCategory === 'all' || item.type === currentCategory;
        const matchesQuery = item.title.toLowerCase().includes(query) || item.user.toLowerCase().includes(query);
        return matchesCategory && matchesQuery;
      });

      renderGrid(filtered);
    }

    // Initial load
    fetchMusicData();
  </script>
</body>
</html>
